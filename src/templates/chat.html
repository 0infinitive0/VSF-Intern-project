<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VSF Trip Planner — Chat</title>
<style>
    :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --border: #e2e5ea;
        --text: #1c2733;
        --muted: #6b7684;
        --user-bubble: #2563eb;
        --user-text: #ffffff;
        --ai-bubble: #eef1f5;
        --ai-text: #1c2733;
        --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
    }
    header {
        padding: 14px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    header h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
    }
    header .subtitle {
        font-size: 12px;
        color: var(--muted);
    }
    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 820px;
        width: 100%;
        margin: 0 auto;
    }
    .bubble-row {
        display: flex;
    }
    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.ai { justify-content: flex-start; }
    .bubble-col {
        max-width: 75%;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .bubble {
        padding: 10px 14px;
        border-radius: 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.45;
        font-size: 14px;
    }
    .bubble.user {
        background: var(--user-bubble);
        color: var(--user-text);
        border-bottom-right-radius: 4px;
    }
    .bubble.ai {
        background: var(--ai-bubble);
        color: var(--ai-text);
        border-bottom-left-radius: 4px;
    }
    .bubble.error {
        background: #fdecea;
        color: #a1260d;
    }
    .bubble.typing {
        color: var(--muted);
        font-style: italic;
    }
    .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    .suggestion-btn {
        border: 1px solid var(--accent);
        background: var(--panel);
        color: var(--accent);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        max-width: 100%;
    }
    .suggestion-btn:hover {
        background: var(--accent);
        color: #ffffff;
    }
    .suggestion-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    footer {
        border-top: 1px solid var(--border);
        background: var(--panel);
        padding: 14px 20px;
    }
    #composer {
        max-width: 820px;
        margin: 0 auto;
        display: flex;
        gap: 10px;
    }
    #message-input {
        flex: 1;
        resize: none;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        min-height: 44px;
        max-height: 140px;
    }
    #message-input:focus {
        outline: none;
        border-color: var(--accent);
    }
    #send-btn {
        padding: 0 20px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
    }
    #send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    #new-chat-btn {
        margin-left: auto;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
    }
    #new-chat-btn:hover {
        background: var(--bg);
    }
</style>
</head>
<body>
<header>
    <div>
        <h1>VSF Trip Planner</h1>
        <div class="subtitle">Chat để lên kế hoạch chuyến đi — gợi ý khách sạn, lịch trình</div>
    </div>
    <button id="new-chat-btn" title="Bắt đầu hội thoại mới">+ Hội thoại mới</button>
</header>

<div id="messages"></div>

<footer>
    <div id="composer">
        <textarea id="message-input" placeholder="Nhập tin nhắn... (vd: Tôi muốn đi Đà Nẵng 3 ngày 2 người)" rows="1"></textarea>
        <button id="send-btn">Gửi</button>
    </div>
</footer>

<script>
const SESSION_KEY = "vsf_trip_planner_session_id";
const HISTORY_KEY_PREFIX = "vsf_trip_planner_history_";

function getSessionId() {
    let id = localStorage.getItem(SESSION_KEY);
    if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(SESSION_KEY, id);
    }
    return id;
}

function historyKey(sessionId) {
    return HISTORY_KEY_PREFIX + sessionId;
}

function loadHistory(sessionId) {
    try {
        return JSON.parse(localStorage.getItem(historyKey(sessionId)) || "[]");
    } catch (e) {
        return [];
    }
}

function saveHistory(sessionId, history) {
    localStorage.setItem(historyKey(sessionId), JSON.stringify(history));
}

let sessionId = getSessionId();

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("message-input");
const sendBtn = document.getElementById("send-btn");
const newChatBtn = document.getElementById("new-chat-btn");

// Reply text sometimes carries a numbered menu ("1. Tiết kiệm (...)", used by both
// the guided budget/amenity questions and the hotel list) — surfaced here as
// clickable chips so the user doesn't have to type the number by hand. The reply
// text itself is untouched and still fully understood if they type instead.
function extractSuggestions(text) {
    const suggestions = [];
    for (const line of text.split("\n")) {
        const match = line.match(/^(\d+)\.\s+(.+)$/);
        if (match) {
            suggestions.push({ number: match[1], label: match[2].split("|")[0].trim() });
        }
    }
    return suggestions;
}

function addSuggestions(container, text) {
    const suggestions = extractSuggestions(text);
    if (suggestions.length === 0) return;

    const wrap = document.createElement("div");
    wrap.className = "suggestions";
    for (const { number, label } of suggestions) {
        const btn = document.createElement("button");
        btn.className = "suggestion-btn";
        btn.textContent = `${number}. ${label}`;
        btn.addEventListener("click", () => {
            if (sendBtn.disabled) return;
            wrap.remove();
            sendMessage(number);
        });
        wrap.appendChild(btn);
    }
    container.appendChild(wrap);
}

function addBubble(role, text, extraClass, showSuggestions = true) {
    const row = document.createElement("div");
    row.className = "bubble-row " + (role === "user" ? "user" : "ai");

    const col = document.createElement("div");
    col.className = "bubble-col";

    const bubble = document.createElement("div");
    bubble.className = "bubble " + (role === "user" ? "user" : "ai") + (extraClass ? " " + extraClass : "");
    bubble.textContent = text;
    col.appendChild(bubble);

    if (role === "ai" && !extraClass && showSuggestions) {
        addSuggestions(col, text);
    }

    row.appendChild(col);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
}

function renderHistory() {
    messagesEl.innerHTML = "";
    const history = loadHistory(sessionId);
    if (history.length === 0) {
        addBubble("ai", "Chào bạn! Bạn muốn đi đâu, trong bao lâu, và đi cùng bao nhiêu người?");
        return;
    }
    // Only the most recent AI message is still "active" — older numbered menus
    // (e.g. a budget question already answered) shouldn't stay clickable.
    history.forEach((turn, index) => {
        addBubble(turn.role, turn.text, undefined, index === history.length - 1);
    });
}

async function sendMessage(overrideText) {
    const usingOverride = overrideText !== undefined;
    const text = (usingOverride ? overrideText : inputEl.value).trim();
    if (!text) return;

    if (!usingOverride) {
        inputEl.value = "";
        inputEl.style.height = "auto";
    }
    sendBtn.disabled = true;

    addBubble("user", text);
    const history = loadHistory(sessionId);
    history.push({ role: "user", text });
    saveHistory(sessionId, history);

    const typingRow = addBubble("ai", "Đang trả lời...", "typing");

    try {
        const response = await fetch("/api/v1/planner_chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        typingRow.remove();

        if (!response.ok) {
            const detail = await response.text();
            addBubble("ai", "Lỗi: " + detail, "error");
            return;
        }
        const data = await response.json();
        addBubble("ai", data.reply);
        const updated = loadHistory(sessionId);
        updated.push({ role: "ai", text: data.reply });
        saveHistory(sessionId, updated);
    } catch (err) {
        typingRow.remove();
        addBubble("ai", "Lỗi kết nối: " + err.message, "error");
    } finally {
        sendBtn.disabled = false;
        inputEl.focus();
    }
}

sendBtn.addEventListener("click", () => sendMessage());
inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});

newChatBtn.addEventListener("click", () => {
    if (!confirm("Bắt đầu hội thoại mới? Lịch sử chat hiện tại (trên trình duyệt này) sẽ được thay bằng phiên mới.")) return;
    sessionId = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, sessionId);
    renderHistory();
});

renderHistory();
</script>
</body>
</html>
