# ── Profiles ──────────────────────────────────────────────────────────────────
# Default (no profile):   backend + frontend only — use cloud LLM (OpenAI/OpenRouter)
# --profile local-llm:    + ollama + ollama-pull (pulls bge-m3 + llama3.1 ~4.7 GB)
#
# Examples:
#   Cloud LLM (default):  docker compose up
#   Local Ollama:         docker compose --profile local-llm up

services:

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Use host's Ollama
      - OLLAMA_URL=http://host.docker.internal:11434
      # LangGraph checkpointer. Without these the backend falls back to a
      # process-local MemorySaver, and EVERY conversation — trip, hotel
      # shortlist, itinerary — is silently lost the moment the container
      # restarts, while the UI keeps showing its own retained copy of the
      # cards. Overridable from ./backend/.env: point
      # CHECKPOINTER_DATABASE_URL at the Supabase session-pooler DSN instead
      # for a deployment where this compose file's local `postgres` isn't
      # the right home for durable state.
      - CHECKPOINTER_BACKEND=${CHECKPOINTER_BACKEND:-postgres}
      - CHECKPOINTER_DATABASE_URL=${CHECKPOINTER_DATABASE_URL:-postgresql://vsf:vsf@postgres:5432/vsf_checkpoints}
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Postgres (LangGraph checkpointer) ───────────────────────────────────────
  # Holds graph state only — conversations, travel_state, hotel cards,
  # itineraries. Trip/hotel CONTENT still lives in Supabase; this is the
  # per-thread checkpoint store LangGraph needs to resume a conversation, and
  # the reason a backend restart no longer wipes one. Named volume, so it
  # outlives `docker compose down` (use `down -v` to actually discard it).
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=vsf
      - POSTGRES_PASSWORD=vsf
      - POSTGRES_DB=vsf_checkpoints
    volumes:
      - checkpointer-data:/var/lib/postgresql/data
    healthcheck:
      # The backend's lifespan runs `checkpointer.setup()` on boot and fails
      # the whole app if the DB isn't accepting connections yet, so this gate
      # is what makes `docker compose up` order-independent.
      test: ["CMD-SHELL", "pg_isready -U vsf -d vsf_checkpoints"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Frontend (React + Vite → Nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public Mapbox token (pk.*, URL-restricted) — read from a root .env
        # or the shell environment. Blank is fine: MapView falls back to an
        # honest "map unavailable" state rather than a broken map.
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Ollama (local LLM) — only with --profile local-llm ──────────────────────
  ollama:
    profiles: [local-llm]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./backend/data/ollama:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=30m
    restart: unless-stopped

  # Pulls bge-m3 (embeddings, ~550 MB) + llama3.1 (chat, ~4.7 GB)
  ollama-pull:
    profiles: [local-llm]
    image: curlimages/curl:latest
    command: >
      sh -c "
      echo 'Waiting for Ollama...' &&
      while ! curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done &&
      echo 'Pulling bge-m3 (embedding model, ~550 MB)...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"bge-m3\"}' &&
      echo 'Pulling llama3.1 (chat model, ~4.7 GB)...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3.1\"}' &&
      echo 'All models pulled successfully.'
      "
    depends_on:
      - ollama

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  # LangGraph checkpoints. Survives `docker compose down`; `down -v` discards
  # it, which means every in-flight conversation is gone.
  checkpointer-data:
