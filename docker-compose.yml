version: "3.8"

# `vsf-shared` is an externally-created bridge network (see README/setup:
# `docker network create vsf-shared`) joined by both this compose project and
# `src/airflow/docker-compose.yaml`, so the Airflow scheduler/worker can reach
# `qdrant`/`ollama` by service name (Phase 4). Each service also keeps the
# default project network so intra-project DNS names are unaffected.
networks:
  default:
    name: vsf-intern-project_default
  vsf-shared:
    external: true

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3


  qdrant:
    # Pinned by digest (Phase 6) — a freeze of the version already running,
    # not an upgrade lever. Resolve a new digest deliberately when a version
    # bump is actually wanted; `docker inspect qdrant/qdrant:latest --format
    # '{{.RepoDigests}}'` on the desired tag gets you the new value.
    image: qdrant/qdrant@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    # No `:-` fallback: an unset QDRANT_API_KEY must fail `docker compose up`,
    # not start an unauthenticated server on a published port. This is the
    # local dev/test Qdrant only — the actual corpus lives on Qdrant Cloud
    # (2026-07-27 deviation), which already enforces its own auth over TLS.
    # This container has neither TLS nor a reverse proxy in front of it, so
    # the key travels as a cleartext header — acceptable only because it's
    # also bound to loopback below, not because the key alone secures it.
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in .env — see .env.example}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - default
      - vsf-shared
    restart: unless-stopped
    healthcheck:
      # No curl/wget in this image (verified: Debian trixie, bash present).
      # CMD-SHELL always runs via /bin/sh, and /dev/tcp is a bash-only
      # extension — sh alone gives "Directory nonexistent", not a failed
      # probe, which silently never passes. Must invoke bash explicitly.
      # Probes /readyz (readiness), not just a bound port.
      test:
        - "CMD-SHELL"
        - >
          bash -c '
          exec 3<>/dev/tcp/localhost/6333 &&
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -1 <&3 | grep -q "200 OK"
          '
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - default
      - vsf-shared
    restart: unless-stopped
    healthcheck:
      # The real startup race this stack has isn't Ollama's own port (it
      # answers immediately) — it's the ollama-pull sidecar's ~2GB bge-m3
      # download, which finishes well after Ollama starts. Gating on
      # `ollama list` containing the model, not just the port, is what
      # makes `depends_on: condition: service_healthy` actually mean "ready
      # to embed" instead of "process started."
      test: ["CMD-SHELL", "ollama list | grep -q bge-m3"]
      interval: 10s
      timeout: 10s
      retries: 60  # generous: a cold pull of ~2GB can take several minutes
      start_period: 30s

  ollama-pull:
    image: curlimages/curl:latest
    command: >
      sh -c "
      echo 'Waiting for Ollama to be ready...' &&
      while ! curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done &&
      echo 'Pulling bge-m3 model...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"bge-m3\"}' &&
      echo 'Model pulled successfully.'
      "
    depends_on:
      - ollama
