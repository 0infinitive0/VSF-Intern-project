<x-dc>
<button onClick="{{ d.onPick }}" onMouseEnter="{{ d.onEnter }}" onMouseLeave="{{ d.onLeave }}" style="text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--g2);border:1px solid var(--edge);cursor:pointer;transition:all .26s cubic-bezier(.34,1.3,.64,1);animation:vFade .5s {{ d.delay }} ease both" style-hover="transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(var(--sh),.55);background:var(--g3)">
  <div style="width:9px;height:9px;border-radius:50%;flex:none;background:{{ d.color }};box-shadow:0 0 0 4px {{ d.halo }}"></div>
  <div style="flex:1">
    <div style="font-size:13.5px;font-weight:590;letter-spacing:-.16px">{{ d.title }}</div>
    <div style="font-size:11.5px;color:var(--t3);font-weight:400;margin-top:1px">{{ d.sub }}</div>
  </div>
  <div style="font-size:12px;color:var(--t4)">→</div>
</button>
</x-dc>
