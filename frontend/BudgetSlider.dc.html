<x-dc>
<div style="padding:16px;border-radius:22px;background:var(--g2);border:1px solid var(--edge);box-shadow:0 14px 34px -18px rgba(var(--sh),.4);animation:vPop .5s cubic-bezier(.22,1,.36,1) both">
  <div style="font-size:10px;font-weight:590;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px">{{ dict.budgetRange }}</div>
  <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:22px">
    <div style="font-size:17px;font-weight:530;letter-spacing:-.5px">{{ bMinLabel }}</div>
    <div style="flex:none;width:14px;height:1px;background:var(--stroke)"></div>
    <div style="font-size:17px;font-weight:530;letter-spacing:-.5px">{{ bMaxLabel }}</div>
  </div>
  <div ref="{{ trackRef }}" onPointerDown="{{ budgetDrag }}" style="position:relative;height:8px;border-radius:99px;background:var(--fill2);margin:0 11px 8px;cursor:pointer;touch-action:none">
    <div style="position:absolute;top:0;bottom:0;left:{{ bFillLeft }};width:{{ bFillWidth }};border-radius:99px;background:linear-gradient(90deg,#3A73DE,#2A9187)"></div>
    <div style="position:absolute;top:50%;left:{{ bMinPct }};width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--g3);border:1px solid var(--edge);box-shadow:0 6px 16px -5px rgba(var(--sh),.55),inset 0 1px 0 #fff;backdrop-filter:blur(6px)"></div>
    <div style="position:absolute;top:50%;left:{{ bMaxPct }};width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--g3);border:1px solid var(--edge);box-shadow:0 6px 16px -5px rgba(var(--sh),.55),inset 0 1px 0 #fff;backdrop-filter:blur(6px)"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--t4)">
    <span>{{ dict.budgetMin }}</span><span>{{ dict.budgetMax }}</span>
  </div>
  <button onClick="{{ confirmBudget }}" style="margin-top:14px;width:100%;padding:10px;border-radius:13px;border:none;background:var(--btn);color:var(--btn-fg);font-size:13px;font-weight:590;letter-spacing:-.12px;cursor:pointer">{{ dict.confirmBudget }}</button>
</div>
</x-dc>
