<x-dc>
<div style="padding:14px;border-radius:22px;background:var(--g2);border:1px solid var(--edge);box-shadow:0 14px 34px -18px rgba(var(--sh),.4);animation:vPop .5s cubic-bezier(.22,1,.36,1) both">
  <div style="font-size:10px;font-weight:590;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:10px">{{ dict.interests }}</div>
  <div style="display:flex;flex-wrap:wrap;gap:7px">
    <sc-for list="{{ interestOptions }}" as="i" hint-placeholder-count="8">
      <button onClick="{{ i.onToggle }}" style="padding:8px 13px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:{{ i.weight }};background:{{ i.bg }};color:{{ i.fg }};border:1px solid {{ i.border }};transition:all .24s cubic-bezier(.34,1.4,.64,1)">{{ i.label }}</button>
    </sc-for>
  </div>
  <button onClick="{{ confirmInterests }}" style="margin-top:12px;width:100%;padding:10px;border-radius:13px;border:none;background:{{ interestBtnBg }};color:{{ interestBtnFg }};font-size:13px;font-weight:590;letter-spacing:-.12px;cursor:pointer">{{ dict.findHotels }}</button>
</div>
</x-dc>
