<x-dc>
<div onMouseEnter="{{ row.onEnter }}" onMouseLeave="{{ row.onLeave }}" style="position:relative;flex:none;animation:vFade .5s {{ row.delay }} ease both">
  <button title="{{ row.title }}" onClick="{{ row.onPick }}" style="width:100%;display:flex;align-items:center;gap:10px;padding:{{ row.pad }};border-radius:14px;border:1px solid {{ row.border }};background:{{ row.bg }};box-shadow:{{ row.shadow }};cursor:pointer;text-align:left;transition:all .28s cubic-bezier(.34,1.3,.64,1)" style-hover="background:var(--g2)">
    <div style="width:32px;height:32px;flex:none;border-radius:11px;background:{{ row.thumb }}"></div>
    <div style="flex:1;min-width:0;display:{{ labelDisplay }}">
      <div style="font-size:12.5px;font-weight:590;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px">{{ row.title }}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
        <div style="font-size:10px;color:var(--t3);font-weight:400;white-space:nowrap">{{ row.date }}</div>
        <div style="font-size:9px;padding:1px 6px;border-radius:99px;background:{{ row.statusBg }};color:{{ row.statusFg }};font-weight:530;white-space:nowrap">{{ row.status }}</div>
      </div>
    </div>
  </button>
  <sc-if value="{{ row.showDelete }}" hint-placeholder-val="{{ false }}">
    <button title="{{ deleteLabel }}" onClick="{{ row.onDelete }}" style="position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:8px;border:1px solid var(--stroke);background:var(--g3);color:var(--t3);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -8px rgba(var(--sh),.7);animation:vFade .2s ease both;transition:all .2s" style-hover="background:#C05E70;color:var(--on-acc);border-color:#C05E70">✕</button>
  </sc-if>
</div>
</x-dc>
