<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VSF Trip Planner — Chat với AI để lên kế hoạch chuyến đi, gợi ý khách sạn và lịch trình cá nhân hoá." />
    <title>VSF Trip Planner</title>
    <link rel="icon" type="image/svg+xml" href="/airplane.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Set data-theme before first paint so a returning dark-mode user
      // doesn't see a flash of the light theme. Reads the same
      // localStorage key hooks/use-theme.ts owns; kept in sync manually
      // since this runs before any JS module loads.
      try {
        if (localStorage.getItem('vota-theme') === 'dark') {
          document.body.dataset.theme = 'dark'
        }
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
