<x-dc>
<div data-hcard="{{ h.id }}" onMouseEnter="{{ h.onEnter }}" onMouseLeave="{{ h.onLeave }}" onClick="{{ h.onOpen }}" style="cursor:pointer;border-radius:26px;padding:16px;background:{{ h.bg }};border:1px solid {{ h.border }};box-shadow:{{ h.shadow }},{{ h.ring }};transform:{{ h.transform }};backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);transition:all .34s cubic-bezier(.34,1.3,.64,1);animation:vFade .55s {{ h.delay }} ease both">
  <div style="display:flex;gap:14px">
    <div style="position:relative;overflow:hidden;width:112px;height:112px;flex:none;border-radius:20px;background:repeating-linear-gradient(115deg,rgba(58,115,222,.16) 0 9px,rgba(58,115,222,.05) 9px 18px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:var(--t4)">{{ dict.hotelPhoto }}
      <div style="position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--sheen),transparent);animation:vSheen 6s 1.2s ease-in-out infinite"></div>
    </div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-size:16px;font-weight:590;letter-spacing:-.32px">{{ h.name }}</div>
          <div style="font-size:11.5px;color:var(--t3);font-weight:400;margin-top:2px">{{ h.area }} · cách trung tâm {{ h.center }}</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
            <div style="font-size:11px;color:#C8802F;letter-spacing:1px">{{ h.starText }}</div>
            <div style="font-size:11.5px;font-weight:590">{{ h.rate }}</div>
            <div style="font-size:11px;color:var(--t3);font-weight:400">{{ h.reviews }}</div>
          </div>
        </div>
        <div style="flex:none;text-align:right">
          <div style="font-size:17px;font-weight:400;letter-spacing:-.5px">{{ h.price }} ₫</div>
          <div style="font-size:10.5px;font-weight:450;letter-spacing:.01em;color:var(--t3);font-weight:400">mỗi đêm · {{ h.total }}</div>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px">
        <sc-for list="{{ h.amen }}" as="a" hint-placeholder-count="4">
          <div style="font-size:10.5px;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--t2)">{{ a.label }}</div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display:flex;gap:14px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
    <div style="flex:none;width:62px;height:62px;border-radius:50%;background:conic-gradient({{ h.matchColor }} {{ h.matchDeg }},var(--fill2) 0);display:flex;align-items:center;justify-content:center">
      <div style="width:50px;height:50px;border-radius:50%;background:var(--g3);display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:14px;font-weight:590;letter-spacing:-.4px">{{ h.match }}</div>
        <div style="font-size:8px;letter-spacing:.08em;color:var(--t3);text-transform:uppercase">{{ dict.matchWord }}</div>
      </div>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{ h.why }}" as="w" hint-placeholder-count="4">
        <div style="display:flex;gap:7px;align-items:flex-start">
          <div style="width:4px;height:4px;border-radius:50%;background:var(--t4);margin-top:6px;flex:none"></div>
          <div style="font-size:11.5px;font-weight:400;color:var(--t2);line-height:1.45;text-wrap:pretty">{{ w.label }}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-top:13px">
    <button onClick="{{ h.onPick }}" style="flex:1;padding:11px;border-radius:15px;border:none;background:{{ h.btnBg }};color:{{ h.btnFg }};font-size:13px;font-weight:590;letter-spacing:-.12px;cursor:pointer;transition:all .26s" style-active="transform:scale(.985)">{{ h.btnLabel }}</button>
    <button onClick="{{ h.onOpen }}" style="flex:none;padding:11px 15px;border-radius:15px;border:1px solid var(--stroke);background:var(--g2);color:var(--t2);font-size:13px;font-weight:530;letter-spacing:-.1px;cursor:pointer;transition:all .26s" style-hover="background:var(--g3);color:var(--t1)" style-active="transform:scale(.985)">{{ dict.viewDetail }}</button>
  </div>
</div>
</x-dc>
