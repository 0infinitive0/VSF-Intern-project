<x-dc>
<div style="animation:vIn .55s {{ it.delay }} cubic-bezier(.22,1,.36,1) both">
  <div data-card="{{ it.id }}" onMouseEnter="{{ it.onEnter }}" onMouseLeave="{{ it.onLeave }}" onClick="{{ it.onClick }}" style="display:flex;gap:12px;padding:13px;border-radius:20px;cursor:pointer;background:{{ it.bg }};border:1px solid {{ it.border }};box-shadow:{{ it.shadow }};transform:{{ it.transform }};transition:all .3s cubic-bezier(.34,1.3,.64,1)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:44px">
      <div style="font-size:11.5px;font-weight:530;color:var(--t2);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"">{{ it.time }}</div>
      <div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:590;color:var(--on-acc);background:{{ it.dotBg }};box-shadow:0 4px 10px -4px {{ it.dotBg }}">{{ it.num }}</div>
    </div>
    <div style="width:52px;height:52px;flex:none;border-radius:14px;background:{{ it.thumb }}"></div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:7px">
        <div style="font-size:14px;font-weight:590;letter-spacing:-.2px">{{ it.name }}</div>
        <div style="font-size:9.5px;padding:2px 7px;border-radius:99px;background:var(--fill);color:var(--t2);white-space:nowrap">{{ it.kind }}</div>
      </div>
      <div style="font-size:11.5px;color:var(--t3);font-weight:400;line-height:1.45;margin-top:3px;text-wrap:pretty">{{ it.note }}</div>
      <div style="font-size:11px;color:var(--t3);margin-top:5px">{{ it.meta }}</div>
    </div>
  </div>
  <sc-if value="{{ it.hasLeg }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:9px;padding:6px 0 6px 52px">
      <div style="width:2px;height:22px;border-radius:2px;background:{{ it.legDash }}"></div>
      <div style="display:flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;border-radius:99px;background:var(--g1);border:1px solid {{ it.legColor }}44">
        <div style="width:7px;height:7px;border-radius:50%;background:{{ it.legColor }}"></div>
        <div style="font-size:10.5px;font-weight:530;color:var(--t3);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"">{{ it.legHop }}</div>
        <div style="font-size:11px;color:var(--t3);font-weight:400">{{ it.leg }}</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
