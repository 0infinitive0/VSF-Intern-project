server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver so service names resolve dynamically
    # (prevents 502s after backend container restarts change its IP)
    resolver 127.0.0.11 valid=10s;

    # SSE (POST /api/v1/planner_chat/stream): buffering would hold the whole
    # stream until it closes — the client sees nothing until then. Exact-match
    # location so this is scoped to just the streaming endpoint; every other
    # /api/ call keeps nginx's normal buffering (shields the backend from a
    # slow client, standard request timeout) via the location below.
    location = /api/v1/planner_chat/stream {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering     off;
        proxy_cache         off;
        # Streams live longer than a normal request (heartbeat frames every
        # 15s keep this idle timeout from firing between events).
        proxy_read_timeout 600s;
        proxy_send_timeout 120s;
    }

    # Proxy the rest of /api requests to the backend service
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
