<!DOCTYPE html>
<html>
<head>
    <title>Attractions Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var locations = [{"name": "Nh\u00e0 B\u1ea3o \u0110\u1ea1i", "category": "Attraction", "lat": 12.2103078, "lng": 109.2153658}, {"name": "Truc Linh 2", "category": "Restaurant", "lat": 12.2356489, "lng": 109.1945677}, {"name": "Good Morning Vietnam", "category": "Restaurant", "lat": 12.2355251, "lng": 109.1949937}, {"name": "Booze Cruise", "category": "Bar", "lat": 12.2332718, "lng": 109.1947767}, {"name": "Ganesh", "category": "Restaurant", "lat": 12.2338278, "lng": 109.1946518}, {"name": "La Mancha", "category": "Restaurant", "lat": 12.2357683, "lng": 109.1962187}, {"name": "Da Fernando", "category": "Restaurant", "lat": 12.233567, "lng": 109.1947165}, {"name": "Ciao Vietnam", "category": "Restaurant", "lat": 12.2340268, "lng": 109.1945904}, {"name": "Echo and Luca", "category": "Restaurant", "lat": 12.2336589, "lng": 109.1946922}];
        
        if (locations.length > 0) {
            var map = L.map('map').setView([locations[0].lat, locations[0].lng], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            
            var bounds = [];
            locations.forEach(function(loc) {
                var marker = L.marker([loc.lat, loc.lng]).addTo(map);
                marker.bindPopup("<b>" + loc.name + "</b><br>" + loc.category);
                bounds.push([loc.lat, loc.lng]);
            });
            
            if (bounds.length > 0) {
                map.fitBounds(bounds);
            }
        } else {
            document.body.innerHTML = "<h1>No coordinates found in database.</h1>";
        }
    </script>
</body>
</html>
